<script>
    async function runRealProxyScan() {
        const input = document.getElementById('demoInput').value;
        const log = document.getElementById('terminalLog');
        
        if (!input.trim()) return;

        log.innerHTML = `<span style="color: #aaa;">[SYSTEM] Transmitting payload to live SiGiL Proxy on port 11435...</span>`;

        try {
            const response = await fetch('http://localhost:11435/api/demo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: input })
            });

            const data = await response.json();

            if (data.action === "BLOCK") {
                log.innerHTML = `[TIME] ${data.timestamp} | Latency: ${data.latency_ms}ms<br>` +
                                `[RAW PROMPT] "${data.Prompt}"<br>` +
                                `<span style="color: var(--accent);">[ALERT] Risk Score: ${data.risk_score} — ${data.reason}</span><br>` +
                                `<span style="color: var(--accent);">[BLOCK] Status 403 Forbidden — Payload dropped at network perimeter.</span>`;
            } else {
                log.innerHTML = `[TIME] ${data.timestamp} | Latency: ${data.latency_ms}ms<br>` +
                                `[RAW PROMPT] "${data.Prompt}"<br>` +
                                `<span style="color: #00f0ff;">[AUDIT] Risk Score: ${data.risk_score} — ${data.reason}</span><br>` +
                                `<span style="color: #00ff66;">[PROXY] Status 200 OK — Forwarded to local inference cluster.</span>`;
            }
        } catch (err) {
            log.innerHTML = `<span style="color: var(--accent);">[ERROR] Could not connect to live proxy instance at port 11435. Ensure container is running.</span>`;
        }
    }
</script>
